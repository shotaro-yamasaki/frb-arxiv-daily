name: Update FRB papers

on:
  schedule:
    - cron: "17 2 * * 1-5"
    - cron: "47 5 * * 1-5"
    - cron: "17 10 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Backfill the last N days from the arXiv API (0 = normal daily run)"
        default: "0"
      sync_hosts:
        description: "Re-import FRB host data from FRBs/FRB now"
        type: boolean
        default: false
      reclassify:
        description: "Re-run keyword classification on all stored papers (after editing config.json)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and classify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ARXIV_CONTACT: ${{ vars.ARXIV_CONTACT }}
        run: |
          if [ "${{ inputs.backfill_days }}" != "" ] && [ "${{ inputs.backfill_days }}" != "0" ]; then
            python scripts/fetch.py --backfill "${{ inputs.backfill_days }}"
          elif [ "${{ inputs.reclassify }}" = "true" ]; then
            python scripts/fetch.py --reclassify
          else
            python scripts/fetch.py --catchup 5
          fi
      - name: Track citations to my papers (needs ADS_TOKEN)
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        continue-on-error: true
        run: python scripts/citations.py
      - name: Sync FRB host data from FRBs/FRB (Mondays, or when missing)
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ ! -f docs/data/hosts_base.json ] || [ "${{ inputs.sync_hosts }}" = "true" ]; then
            git clone -q --depth 1 https://github.com/FRBs/FRB /tmp/FRB && python scripts/hosts_sync.py /tmp/FRB
          else
            echo "Not Monday: skipping host sync"
          fi
      - name: Download the background image once (M51, ESA/Hubble, CC BY 4.0)
        continue-on-error: true
        run: |
          if [ ! -f docs/img/galaxy-bg.jpg ]; then
            mkdir -p docs/img
            curl -fsSL -o docs/img/galaxy-bg.jpg https://cdn.esahubble.org/archives/images/wallpaper4/heic0506a.jpg \
              || curl -fsSL -o docs/img/galaxy-bg.jpg https://cdn.esahubble.org/archives/images/screen/heic0506a.jpg \
              || rm -f docs/img/galaxy-bg.jpg
            ls -la docs/img || true
          fi
      - name: Check literature host values
        run: python scripts/check_hosts_lit.py
      - name: Check phase-space values
        run: python scripts/check_phase_manual.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json
          git add docs/img/*.jpg 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update FRB papers $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git push origin HEAD:${{ github.event.repository.default_branch }} && exit 0
            echo "Push rejected, retrying after rebase ($i)"
            sleep $((i * 5))
            git pull --rebase -X theirs origin ${{ github.event.repository.default_branch }}
          done
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
