name: Update FRB papers

on:
  schedule:
    - cron: "17 2 * * 1-5"
    - cron: "47 5 * * 1-5"
    - cron: "17 10 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Backfill the last N days from the arXiv API (0 = normal daily run)"
        default: "0"
      reclassify:
        description: "Re-run keyword classification on all stored papers (after editing config.json)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and classify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ARXIV_CONTACT: ${{ vars.ARXIV_CONTACT }}
        run: |
          if [ "${{ inputs.backfill_days }}" != "" ] && [ "${{ inputs.backfill_days }}" != "0" ]; then
            python scripts/fetch.py --backfill "${{ inputs.backfill_days }}"
          elif [ "${{ inputs.reclassify }}" = "true" ]; then
            python scripts/fetch.py --reclassify
          else
            python scripts/fetch.py　--catchup 5
          fi
      - name: Track citations to my papers (needs ADS_TOKEN)
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        continue-on-error: true
        run: python scripts/citations.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/papers.json docs/data/citations.json 2>/dev/null || git add docs/data/papers.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update FRB papers $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git push origin HEAD:${{ github.event.repository.default_branch }} && exit 0
            echo "Push rejected, retrying after rebase ($i)"
            sleep $((i * 5))
            git pull --rebase -X theirs origin ${{ github.event.repository.default_branch }}
          done
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
